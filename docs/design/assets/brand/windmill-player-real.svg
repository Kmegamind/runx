<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 210" width="220" height="210">
  <!-- Real world: a pencil windmill. Sails = story parts (done, current, upcoming, upcoming). Rotate the #sails group around 110 98. -->
  <path d="M92 208 L100 112 H120 L128 208 Z" fill="#F3EFE4" stroke="#2E2A1F" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M96 114 L110 96 L124 114" fill="none" stroke="#2E2A1F" stroke-width="2.5" stroke-linejoin="round"/>
  <g id="sails" fill="#F3EFE4" stroke="#2E2A1F" stroke-width="2.5">
    <rect x="104" y="8" width="12" height="82" rx="6" fill="#2E2A1F"/>
    <rect x="104" y="8" width="12" height="82" rx="6" transform="rotate(90 110 98)" fill="#4F6B1F"/>
    <rect x="104" y="8" width="12" height="82" rx="6" transform="rotate(180 110 98)"/>
    <rect x="104" y="8" width="12" height="82" rx="6" transform="rotate(270 110 98)"/>
    <circle cx="110" cy="98" r="9" fill="#2E2A1F" stroke="none"/>
  </g>
</svg>
