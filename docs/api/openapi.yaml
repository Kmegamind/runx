# Draft API contract (issue #15). Endpoints and schemas are provisional until the routes are built.
openapi: 3.1.0
info:
  title: RunX API
  version: 0.1.0
  description: Read episodes and scenes; read and write your own progress.
servers:
  - url: /api
paths:
  /episodes:
    get:
      summary: List published episodes
      responses:
        "200":
          description: Episodes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Episode" }
  /episodes/{episodeId}/scenes:
    get:
      summary: List the scenes of a published episode
      parameters:
        - { name: episodeId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Scenes in story order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Scene" }
        "404": { description: Episode not found }
  /progress/{episodeId}:
    get:
      summary: Get my progress for an episode
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: episodeId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: My progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "401": { description: Not signed in }
    put:
      summary: Save my progress (must be a valid checkpoint)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: episodeId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Progress" }
      responses:
        "200": { description: Saved }
        "400": { description: Invalid checkpoint }
        "401": { description: Not signed in }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Episode:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
    Scene:
      type: object
      required: [id, type, durationSec]
      properties:
        id: { type: string }
        type:
          type: string
          enum: [opening, core, optional, climax, ending, signoff, recap, compressed_ending]
        durationSec: { type: integer, minimum: 1 }
    Progress:
      type: object
      required: [checkpoint, status]
      properties:
        checkpoint: { type: string, enum: [CP1, CP2, CP3] }
        status: { type: string, enum: [in_progress, complete] }
